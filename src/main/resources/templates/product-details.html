<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product != null ? product.category.name + ' - FemiPick Fashions' : 'Product Details'}">
        Product Details
    </title>
    <link rel="stylesheet" href="/css/style.css">

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #faf8f5;
            color: #2c2c2c;
        }
        /* Black Header with Gold Text */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background-color: #000000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .logo { font-size: 1.4rem; font-weight: 700; color: #f6d58a; }
        nav a { margin-left: 18px; text-decoration: none; color: #f6d58a; font-weight: 500; }
        nav a:hover { color: #ffffff; }

        .details-container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 24px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            align-items: start;
        }
        .image-box {
            width: 100%;
            background-color: #f9f6f2;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }
        .image-box img {
            width: 100%;
            max-height: 550px;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }
        .info-box h1 { margin-top: 0; color: #4a1c40; font-size: 1.8rem; }
        .price-tag { font-size: 1.5rem; font-weight: 700; color: #6b2d5c; margin: 15px 0; }
        .description-text {
            font-size: 1rem;
            line-height: 1.6;
            color: #444;
            white-space: pre-line;
            margin-bottom: 25px;
        }
        .btn-back {
            display: inline-block;
            padding: 10px 20px;
            border: 1.5px solid #6b2d5c;
            color: #6b2d5c;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }
        @media (max-width: 768px) {
            .details-container { grid-template-columns: 1fr; margin: 15px; padding: 16px; gap: 20px; }
            .info-box h1 { font-size: 1.4rem; }
            .price-tag { font-size: 1.3rem; }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">FemiPick Fashions</div>
    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/products}">Collections</a>
    </nav>
</header>

<div class="details-container" th:if="${product != null}">
    <div class="image-box">
        <img th:src="@{'/collection/image/' + ${product.id}}"
             th:alt="${product.category.name}">
    </div>

    <div class="info-box">
        <h1 th:text="${product.category.name}">Antique Full Set</h1>

        <div class="price-tag" th:if="${product.price != null}">
            ₹ <span th:text="${product.price}">1500</span>
        </div>

        <p class="description-text"
           th:text="${product.description != null ? product.description : 'Traditional handcrafted jewellery set.'}">
            Description
        </p>

        <a th:href="@{/products(category=${product.category.id})}" class="btn-back">
            ← Back to <span th:text="${product.category.name}">Category</span>
        </a>
    </div>
</div>

</body>
</html>
